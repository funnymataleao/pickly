<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickly - Scan better. Choose smarter.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 0.3em;
            color: #1d1d1f;
        }
        
        .tagline {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 2em;
            font-weight: 500;
        }
        
        p {
            margin-bottom: 2em;
            color: #515154;
            font-size: 1.1em;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 2em;
        }
        
        .link {
            display: inline-block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .link:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .link.secondary {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .link.secondary:hover {
            background: #667eea;
            color: white;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .tagline {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛒</div>
        <h1>Pickly</h1>
        <p class="tagline">Scan better. Choose smarter.</p>
        <p>A calm, clear grocery scanner that helps you make better food choices quickly.</p>
        
        <div class="links">
            <a href="https://apps.apple.com/app/pickly" class="link">Download on App Store</a>
            <a href="privacy.html" class="link secondary">Privacy Policy</a>
            <a href="https://github.com/funnymataleao/pickly" class="link secondary">GitHub</a>
        </div>
    </div>
</body>
</html>
